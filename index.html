<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine de Recomendações</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #333; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 250px; text-align: center; }
        .card img { max-width: 100%; border-radius: 5px; height: 150px; object-fit: cover; }
        .btn { display: inline-block; margin-top: 10px; padding: 10px 15px; background-color: #28a745; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h1>Produtos Recomendados</h1>
    <p>Confira os melhores achadinhos e ofertas selecionadas!</p>

    <div class="grid">
        <!-- Produto 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Produto 1">
            <h3>Produto Exemplo 1</h3>
            <p>R$ 99,90</p>
            <a href="https://seu-link-de-afiliado.com" class="btn" target="_blank">Ver Oferta</a>
        </div>
    </div>

</body>
</html>
